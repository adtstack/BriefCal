name: Build and publish DMG

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use the form v0.1.0; received: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Record toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project KaosCal.xcodeproj \
            -scheme KaosCal \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/KaosCalTestsDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/KaosCalTests.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build universal Release app
        run: |
          set -euo pipefail
          xcodebuild \
            -project KaosCal.xcodeproj \
            -scheme KaosCal \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/KaosCalReleaseDerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            build

      - name: Verify Release app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KaosCalReleaseDerivedData/Build/Products/Release/KaosCal.app"
          INFO="$APP/Contents/Info.plist"
          ENTITLEMENTS="$RUNNER_TEMP/KaosCal.entitlements.plist"

          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$ENTITLEMENTS"
          codesign -d --verbose=4 "$APP" 2>&1 | grep -E 'flags=.*runtime'
          lipo "$APP/Contents/MacOS/KaosCal" -verify_arch arm64 x86_64

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "com.adtstack.kaoscal"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$INFO")" = "14.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$INFO")" = ""
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$INFO")" = ""
          test "$(/usr/libexec/PlistBuddy -c 'Print :SURequireSignedFeed' "$INFO")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableSystemProfiling' "$INFO")" = "false"

          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.personal-information.calendars' "$ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' "$ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.temporary-exception.mach-lookup.global-name:0' "$ENTITLEMENTS")" = "com.adtstack.kaoscal-spks"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.temporary-exception.mach-lookup.global-name:1' "$ENTITLEMENTS")" = "com.adtstack.kaoscal-spki"
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$ENTITLEMENTS" >/dev/null 2>&1
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test -x "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          test -d "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          test -d "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          test -d "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          test -z "$(find "$APP" -name '*.xctest' -o -name '*XCTest*' -print -quit)"

      - name: Create DMG and checksum
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/KaosCalReleaseDerivedData/Build/Products/Release/KaosCal.app"
          DMG_ROOT="$RUNNER_TEMP/KaosCalDMGRoot"
          DIST="$GITHUB_WORKSPACE/dist"
          DMG="$DIST/KaosCal-${VERSION}-local.dmg"

          rm -rf "$DMG_ROOT" "$DIST"
          mkdir -p "$DMG_ROOT" "$DIST"
          ditto "$APP" "$DMG_ROOT/KaosCal.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          cp PRIVACY.md THIRD_PARTY_NOTICES.md BETA-LICENSE.md "$DMG_ROOT/"

          hdiutil create \
            -volname "KaosCal ${VERSION} Local" \
            -srcfolder "$DMG_ROOT" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$DMG"
          hdiutil verify "$DMG"

          cd "$DIST"
          shasum -a 256 "$(basename "$DMG")" > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Verify packaged app
        run: |
          set -euo pipefail
          DMG="$GITHUB_WORKSPACE/dist/KaosCal-${VERSION}-local.dmg"
          MOUNT_POINT="$RUNNER_TEMP/KaosCalDMGMount"
          mkdir -p "$MOUNT_POINT"

          cleanup() {
            hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG"
          codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/KaosCal.app"
          lipo "$MOUNT_POINT/KaosCal.app/Contents/MacOS/KaosCal" -verify_arch arm64 x86_64
          test -L "$MOUNT_POINT/Applications"
          test -z "$(find "$MOUNT_POINT/KaosCal.app" -name '*.xctest' -o -name '*XCTest*' -print -quit)"
          cleanup
          trap - EXIT

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: KaosCal-${{ github.ref_name }}-test-results
          path: ${{ runner.temp }}/KaosCalTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="dist/KaosCal-${VERSION}-local.dmg"
          CHECKSUMS="dist/SHA256SUMS.txt"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DMG" "$CHECKSUMS" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$DMG#KaosCal ${VERSION} local-test DMG" \
              "$CHECKSUMS#SHA-256 checksums" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "KaosCal ${VERSION} local test build" \
              --notes "This automated build is ad-hoc signed and is not Developer ID notarized. It is for local testing, not a public beta distribution candidate."
          fi
