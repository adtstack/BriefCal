name: Build and publish DMG

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use the form v0.1.0; received: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "BUILD=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Record toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project BriefCal.xcodeproj \
            -scheme BriefCal \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/BriefCalTestsDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/BriefCalTests.xcresult" \
            -enableCodeCoverage YES \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -skip-testing:BriefCalUITests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Enforce app coverage floor
        run: |
          set -euo pipefail
          xcrun xccov view \
            --report \
            --json \
            "$RUNNER_TEMP/BriefCalTests.xcresult" \
            > "$RUNNER_TEMP/BriefCalCoverage.json"
          /usr/bin/python3 scripts/check_coverage.py \
            "$RUNNER_TEMP/BriefCalCoverage.json" \
            0.50

      - name: Run isolated UI automation
        run: |
          set -euo pipefail
          xcodebuild \
            -project BriefCal.xcodeproj \
            -scheme BriefCal \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/BriefCalUITestsDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/BriefCalUITests.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -parallel-testing-enabled NO \
            -only-testing:BriefCalUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=YES \
            test

      - name: Run static analyzer
        run: |
          set -euo pipefail
          xcodebuild \
            -project BriefCal.xcodeproj \
            -scheme BriefCal \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/BriefCalAnalyzeDerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Compile production-shaped Release code
        run: |
          set -euo pipefail
          xcodebuild \
            -project BriefCal.xcodeproj \
            -scheme BriefCal \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/BriefCalProductionReleaseDerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            build
          INFO="$RUNNER_TEMP/BriefCalProductionReleaseDerivedData/Build/Products/Release/BriefCal.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BriefCalLocalTestBuild' "$INFO")" = "NO"
          xcodebuild \
            -project BriefCal.xcodeproj \
            -scheme BriefCal \
            -configuration Release \
            -showBuildSettings \
            > "$RUNNER_TEMP/BriefCalProductionBuildSettings.txt"
          grep -Eq '^ *ENABLE_HARDENED_RUNTIME = YES$' "$RUNNER_TEMP/BriefCalProductionBuildSettings.txt"
          grep -Eq '^ *BRIEFCAL_LOCAL_TEST_BUILD = NO$' "$RUNNER_TEMP/BriefCalProductionBuildSettings.txt"

      - name: Build and launch-smoke universal local-test Release app
        env:
          BRIEFCAL_LOCAL_DERIVED_DATA: ${{ runner.temp }}/BriefCalReleaseDerivedData
        run: |
          set -euo pipefail
          export BRIEFCAL_MARKETING_VERSION="$VERSION"
          export BRIEFCAL_CURRENT_PROJECT_VERSION="$BUILD"
          bash scripts/build_local_test_app.sh

      - name: Verify Release app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BriefCalReleaseDerivedData/Build/Products/Release/BriefCal.app"
          INFO="$APP/Contents/Info.plist"
          ENTITLEMENTS="$RUNNER_TEMP/BriefCal.entitlements.plist"

          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$ENTITLEMENTS"
          ! codesign -d --verbose=4 "$APP" 2>&1 | grep -E 'flags=.*runtime'
          lipo "$APP/Contents/MacOS/BriefCal" -verify_arch arm64 x86_64

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO")" = "com.adtstack.briefcal"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")" = "$BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$INFO")" = "14.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :BriefCalLocalTestBuild' "$INFO")" = "YES"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$INFO")" = ""
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$INFO")" = ""
          test "$(/usr/libexec/PlistBuddy -c 'Print :SURequireSignedFeed' "$INFO")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableSystemProfiling' "$INFO")" = "false"

          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.personal-information.calendars' "$ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.files.user-selected.read-write' "$ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.temporary-exception.mach-lookup.global-name:0' "$ENTITLEMENTS")" = "com.adtstack.briefcal-spks"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.temporary-exception.mach-lookup.global-name:1' "$ENTITLEMENTS")" = "com.adtstack.briefcal-spki"
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$ENTITLEMENTS" >/dev/null 2>&1
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test -x "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          test -d "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app"
          test -d "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
          test -d "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
          test -z "$(find "$APP" -name '*.xctest' -o -name '*XCTest*' -print -quit)"

      - name: Create DMG and checksum
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BriefCalReleaseDerivedData/Build/Products/Release/BriefCal.app"
          DMG_ROOT="$RUNNER_TEMP/BriefCalDMGRoot"
          DIST="$GITHUB_WORKSPACE/dist"
          DMG="$DIST/BriefCal-${VERSION}-local.dmg"

          rm -rf "$DMG_ROOT" "$DIST"
          mkdir -p "$DMG_ROOT" "$DIST"
          ditto "$APP" "$DMG_ROOT/BriefCal.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          cp PRIVACY.md THIRD_PARTY_NOTICES.md BETA-LICENSE.md "$DMG_ROOT/"

          hdiutil create \
            -volname "BriefCal ${VERSION} Local" \
            -srcfolder "$DMG_ROOT" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$DMG"
          hdiutil verify "$DMG"

          cd "$DIST"
          shasum -a 256 "$(basename "$DMG")" > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Verify packaged app
        run: |
          set -euo pipefail
          DMG="$GITHUB_WORKSPACE/dist/BriefCal-${VERSION}-local.dmg"
          MOUNT_POINT="$RUNNER_TEMP/BriefCalDMGMount"
          mkdir -p "$MOUNT_POINT"

          cleanup() {
            hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG"
          bash scripts/verify_local_test_app.sh "$MOUNT_POINT/BriefCal.app"
          lipo "$MOUNT_POINT/BriefCal.app/Contents/MacOS/BriefCal" -verify_arch arm64 x86_64
          test -L "$MOUNT_POINT/Applications"
          test -z "$(find "$MOUNT_POINT/BriefCal.app" -name '*.xctest' -o -name '*XCTest*' -print -quit)"
          cleanup
          trap - EXIT

      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: BriefCal-${{ github.ref_name }}-test-results
          path: |
            ${{ runner.temp }}/BriefCalTests.xcresult
            ${{ runner.temp }}/BriefCalUITests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DMG="dist/BriefCal-${VERSION}-local.dmg"
          CHECKSUMS="dist/SHA256SUMS.txt"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DMG" "$CHECKSUMS" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$DMG#BriefCal ${VERSION} local-test DMG" \
              "$CHECKSUMS#SHA-256 checksums" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "BriefCal ${VERSION} local test build" \
              --notes "This automated local-test build is ad-hoc signed, has hardened runtime disabled because ad-hoc signatures have no Developer ID Team identity, and is not notarized. It is for local testing only, not a public beta distribution candidate."
          fi
